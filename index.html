<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국어 1등급 노트</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="국어노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 화면 폰 앱 — 위 머리줄, 위로 넘기는 릴스 피드(카드마다 한 화면), 아래 탭 막대. PC에서는 가운데 460px 기둥 */
:root{
  --bg:#12111f; --panel:#1e1c33; --panel2:#2a2746; --line:#3a3660;
  --ink:#f3f1ff; --muted:#aaa7c9;
  --accent:#ff4f8b; --mint:#2fe0d0; --gold:#ffc53d; --ok:#3ddc97; --no:#ff6b78;
  --violet1:#21155e; --violet2:#4b33c2; --teal1:#0b2a31; --teal2:#0f4a52; --rose1:#3a1030; --rose2:#6e1f52;
  --paper:#f7f2e4; --paper-ink:#1d1a14; --paper-muted:#6d6555; --mark:#ffe28a;
  --white:#ffffff; --dark-ink:#15152b; --scrim:rgba(5,4,15,.62);
  --f-display:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 공통 모듈(도움말·오답 사진) 색 맞추기 */
  --ah-bg-app:#171628; --ah-panel-app:#23213b; --ah-ink-app:#f3f1ff; --ah-muted-app:#aaa7c9; --ah-accent-app:#2fe0d0; --ah-hl-app:#ffc53d;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{word-break:keep-all;overflow-wrap:anywhere;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

/* 머리줄 */
.top{display:flex;flex-direction:column;gap:10px;padding-block:10px 10px}
.bar{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.68rem;color:var(--muted);letter-spacing:.06em}
.lvchip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--panel);font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lvchip i{font-style:normal;color:var(--gold)}
.icchip,.ttschip,.ah-chip{min-width:34px;min-height:32px;border:0;border-radius:99px;background:var(--panel);cursor:pointer;font-weight:800}
.ttschip.off{opacity:.55}

/* 스토리 */
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;width:62px}
.story .ring{width:54px;height:54px;border-radius:50%;padding:3px;background:conic-gradient(var(--accent),var(--gold),var(--mint),var(--accent))}
.story.seen .ring{background:var(--line)}
.story .in{width:100%;height:100%;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;border:2px solid var(--bg)}
.story span{font-size:.68rem;color:var(--muted);white-space:nowrap}

/* 본문 스크롤 영역 */
#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y proximity;display:flex;flex-direction:column;gap:14px;padding-bottom:14px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
#view.list{scroll-snap-type:none}

/* 카드 공통 */
.card{scroll-snap-align:start;min-height:100%;flex:none;border-radius:26px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;position:relative}
.card.concept{background:linear-gradient(165deg,var(--violet1),var(--violet2) 78%)}
.card.quiz{background:linear-gradient(170deg,var(--teal1),var(--teal2))}
.card.passage{background:var(--panel2)}
.card.self{background:linear-gradient(165deg,var(--rose1),var(--rose2))}
.card.done{background:var(--panel);align-items:center;justify-content:center;text-align:center}
.ch{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kind{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.16)}
.unit,.src{font-size:.72rem;color:rgba(255,255,255,.72)}
.src::before{content:"·";margin-right:6px}
.acts{margin-left:auto;display:flex;gap:6px}
.act{width:36px;height:36px;border:0;border-radius:50%;background:rgba(0,0,0,.28);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.act.on{background:var(--white);color:var(--accent)}
.act.speaking,.exspk.speaking{animation:ttspulse 1s ease-in-out infinite}
@keyframes ttspulse{0%,100%{box-shadow:0 0 0 0 rgba(47,224,208,.65)}50%{box-shadow:0 0 0 8px rgba(47,224,208,0)}}
.swipe{margin-top:auto;align-self:center;font-size:.72rem;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:4px}

/* 개념 카드 */
.ct{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1.15;text-wrap:balance}
.cb{margin:0;font-size:1.12rem;line-height:1.95;font-weight:500}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:34px;padding:2px 10px;margin:0 2px;border:2px dashed rgba(255,255,255,.6);border-radius:10px;background:rgba(0,0,0,.18);font-weight:700;cursor:pointer;vertical-align:middle;line-height:1.3}
.blank.on{border-style:solid;border-color:var(--gold);background:var(--gold);color:var(--dark-ink)}
.exrow{display:flex;flex-wrap:wrap;gap:6px}
.exrow span{padding:6px 11px;border-radius:12px;background:rgba(0,0,0,.24);font-size:.92rem}
.pr{font-family:var(--f-display);font-weight:700;color:var(--gold);white-space:nowrap}
.explain .pr,.paper .pr{color:#9a5b00}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{padding:8px 13px;border:1px solid rgba(255,255,255,.35);border-radius:99px;background:none;font-size:.85rem;font-weight:700;cursor:pointer}

/* 개념 설명 (explain.css를 앱 색에 맞춤) */
.exbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:0;border-radius:99px;background:var(--white);color:var(--violet2);font-weight:700;font-size:.9rem;box-shadow:0 6px 0 rgba(0,0,0,.2);cursor:pointer}
.explain{background:#fffbea;color:#2b2410;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:2px solid var(--gold)}
.explain p{margin:0;font-size:.95rem;line-height:1.65}
.exh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exh b{font-size:.76rem;color:#9a6a00;letter-spacing:.06em}
.exspk{padding:5px 11px;border:0;border-radius:99px;background:#ffe9a8;color:#5a4300;font-weight:700;font-size:.78rem;cursor:pointer}
.extip{font-size:.9rem;font-weight:600;padding:8px 10px;border-radius:12px;background:#fff3c4}
.extip .tl{display:block;font-size:.7rem;font-weight:700;color:#9a6a00;margin-bottom:2px;letter-spacing:.04em}
.exclose{align-self:flex-end;border:0;background:none;font-size:.78rem;font-weight:700;color:#9a6a00;text-decoration:underline;cursor:pointer}

/* 문항 */
.qn{margin:0;font-weight:700;font-size:1.05rem;line-height:1.6}
.qn em{font-style:normal;text-decoration:underline;text-underline-offset:4px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;padding:11px 12px;border:0;border-radius:14px;background:rgba(255,255,255,.1);cursor:pointer;line-height:1.5}
.opt .no{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok);color:#062b1c}
.opt.wrong{background:var(--white);color:#b0172a}
.opt.dim{opacity:.62}
.why{grid-column:2;font-size:.84rem;font-weight:500;opacity:.92;margin-top:2px}
.opt.right .why{opacity:1}
.result{padding:10px 12px;border-radius:14px;font-weight:700;display:flex;flex-direction:column;gap:8px}
.result.ok{background:rgba(61,220,151,.18);color:var(--ok)}
.result.bad{background:rgba(255,107,120,.16);color:var(--no)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 12px;border:0;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ink);font-weight:700;font-size:.8rem;cursor:pointer}
.chips button.on{background:var(--white);color:var(--dark-ink)}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.25);font-size:.88rem}
.hint b{color:var(--mint);margin-right:6px;font-size:.76rem;letter-spacing:.04em}
.hintbtn{align-self:flex-start;padding:8px 13px;border:0;border-radius:99px;background:rgba(47,224,208,.18);color:var(--mint);font-weight:700;font-size:.82rem;cursor:pointer}

/* 지문 카드: 시험지 느낌 */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:14px 15px 16px;font-family:var(--f-display);font-size:1rem;line-height:1.9;display:flex;flex-direction:column;gap:8px}
.paper .lead{font-family:var(--f-body);font-weight:700;font-size:.86rem;color:var(--paper-ink);border-bottom:1px solid #d8cfb6;padding-bottom:6px}
.paper p{margin:0;text-indent:.6em}
.s.ev{background:linear-gradient(transparent 52%,var(--mark) 52%);box-shadow:none}
.s.ev::after{content:"근거";font-family:var(--f-body);font-size:.6rem;font-weight:700;color:#8a5a00;vertical-align:super;margin-left:2px}

/* 서술형 */
.quote{font-family:var(--f-display);font-size:1.25rem;font-weight:700;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.25);text-align:center}
textarea{width:100%;min-height:86px;resize:vertical;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:16px;line-height:1.5}
.model{padding:12px 14px;border-radius:14px;background:var(--white);color:var(--dark-ink);display:flex;flex-direction:column;gap:8px}
.model b.h{font-size:.74rem;color:var(--rose2);letter-spacing:.06em}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.checks input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grade button{min-height:44px;border:0;border-radius:12px;font-weight:700;font-size:.85rem;cursor:pointer;background:#efeaf7;color:var(--dark-ink)}
.grade button.g1{background:var(--ok);color:#062b1c}
.grade button.g3{background:#ffe1e4;color:#b0172a}
.pill{align-self:flex-start;padding:7px 13px;border-radius:99px;background:var(--ok);color:#062b1c;font-weight:700;font-size:.85rem}

/* 완료 카드 */
.done h2{margin:0;font-family:var(--f-display);font-size:1.9rem}
.done p{margin:0;color:var(--muted)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px}
.stat3 div{padding:12px 6px;border-radius:16px;background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.stat3 b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat3 span{font-size:.72rem;color:var(--muted)}

/* 목록형 탭 */
.sec{display:flex;flex-direction:column;gap:8px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sech h3{margin:0;font-family:var(--f-display);font-size:1.15rem}
.sech span{font-size:.75rem;color:var(--muted)}
.tile{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:13px 14px;border-radius:16px;background:var(--panel);border:0;text-align:left;cursor:pointer;width:100%}
.tile b{font-size:.98rem}
.tile small{grid-column:1;color:var(--muted);font-size:.78rem}
.tile .pct{grid-row:1/3;grid-column:2;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mint)}
.meter{grid-column:1/3;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-radius:3px}
.tile.now{box-shadow:inset 0 0 0 2px var(--accent)}
.tile.now .pct{color:var(--accent)}
.tile.now .meter i{background:var(--accent)}
.badge{display:inline-block;margin-left:6px;font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--white);vertical-align:middle}
.ritem{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-radius:16px;background:var(--panel)}
.ritem .ic{width:48px;height:48px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.ritem .ic.photo{background:repeating-linear-gradient(0deg,#ddd5bf 0 6px,var(--paper) 6px 12px);color:var(--paper-ink);font-size:.7rem}
.ritem b{display:block;font-size:.92rem}
.ritem small{color:var(--muted);font-size:.76rem}
.ritem .due{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--accent);color:var(--white);white-space:nowrap}
.ritem .due.later{background:var(--panel2);color:var(--muted)}

/* 프로필 */
.prof{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:14px;border-radius:20px;background:linear-gradient(165deg,var(--violet1),var(--violet2))}
.avatar{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:1.6rem}
.prof b{font-size:1.1rem}
.prof small{display:block;color:rgba(255,255,255,.75);font-size:.8rem}
.xpbar{grid-column:1/3;height:10px;border-radius:5px;background:rgba(0,0,0,.3);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.box{padding:14px;border-radius:18px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.box h4{margin:0;font-size:.95rem}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:96px 1fr 26px;gap:8px;align-items:center;font-size:.8rem}
.brow .tr{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:6px;background:var(--muted)}
.brow.hot .tr i{background:var(--accent)}
.brow b{text-align:right;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:.78rem;color:var(--muted)}
.ttsset .chips{margin-top:8px}
.ttsset .chips button.on{background:var(--violet2);color:var(--white)}
.primary{min-height:48px;border:0;border-radius:16px;background:var(--accent);color:var(--white);font-weight:700;cursor:pointer}

/* 탭 막대 */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:6px 8px;border-top:1px solid var(--panel)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.68rem;font-weight:700;cursor:pointer;padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.plus{justify-self:center;width:52px;height:40px;border:0;border-radius:14px;background:var(--accent);color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:-4px 0 0 var(--mint),4px 0 0 var(--gold);margin-bottom:6px}
.plus svg{width:24px;height:24px}

/* 겹침 화면 (오답 사진 노트 모양) */
.wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;background:var(--ah-bg-app);color:var(--ink);border-radius:26px 26px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--panel2);margin:0 auto}
.sheet h3{margin:0;font-size:1.2rem}
.big{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border:0;border-radius:18px;background:var(--panel);cursor:pointer}
.big .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.big small{display:block;color:var(--muted);font-size:.8rem}
.closebtn{min-height:46px;border:0;border-radius:16px;background:var(--panel);font-weight:700;cursor:pointer}

/* 도움말 (help.css) */

/* 잠금 화면 (lock.css) */

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;max-width:calc(100% - 32px);padding:10px 16px;border-radius:99px;background:var(--white);color:var(--dark-ink);font-weight:700;font-size:.86rem;box-shadow:0 8px 24px rgba(0,0,0,.4);text-align:center}
.exrow.plain{flex-direction:column;gap:6px}
.exrow.plain span{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:baseline;line-height:1.45}
.exrow.plain b{color:var(--gold);font-size:.86rem}
.quote.q2{font-size:1rem;font-weight:400;text-align:left;line-height:1.75}
.opt u{text-underline-offset:4px;text-decoration-thickness:2px}
.rtag{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.rtag.hot{background:var(--accent);color:var(--white)}
.sech h3{font-size:1.05rem}
.back{align-self:flex-start;border:0;background:none;color:var(--mint);font-weight:700;padding:4px 0;cursor:pointer}
.uhead{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px;background:linear-gradient(165deg,var(--violet1),var(--violet2))}
.uhead h2{margin:0;font-family:var(--f-display);font-size:1.45rem;line-height:1.3;text-wrap:balance}
.uhead .meter{display:block;height:8px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
.uhead .meter i{display:block;height:100%;background:var(--gold)}
.hotx{color:var(--accent)}
.ugoal{margin:0;line-height:1.6}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchips span{padding:5px 10px;border-radius:99px;background:var(--panel2);font-size:.8rem;font-weight:600}
.ucard{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:16px;background:var(--panel);cursor:pointer}
.uk{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.uk.concept{background:var(--violet2)} .uk.quiz{background:var(--teal2)} .uk.passage{background:var(--paper);color:var(--paper-ink)} .uk.self{background:var(--rose2)}
.ut{font-size:.9rem;line-height:1.45;min-width:0}
.ud{font-weight:700;color:var(--mint)}
.box.empty{text-align:center;align-items:center}

<div class="app">
  <header class="top" id="top"></header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="화면 이동"></nav>

<script>
/* ===== 도움말 모듈 (수학 1등급 노트에서 검증) ===== */
const AppHelp=(function(){
  let C={title:"사용법",sections:[],footer:"",seenKey:"app-help-seen"};
  const nav=t=>t.replace(/\s*\(.*\)\s*$/,"");
  function init(cfg){C=Object.assign(C,cfg)}
  function chip(focus,label){return `<button class="ah-chip" data-ah="${focus}" aria-label="${label||"도움말"}">?</button>`}
  function open(focus){
    focus=focus||(C.sections[0]||[])[0];
    let el=document.getElementById("ahLayer");if(!el){el=document.createElement("div");el.id="ahLayer";document.body.appendChild(el)}
    el.innerHTML=`<div class="ah-wrap" data-ah-close><div class="ah-sheet" role="dialog" aria-modal="true" aria-label="${C.title}">
      <div class="ah-head"><div class="ah-row"><h2>${C.title}</h2><button class="ah-btn" data-ah-close>닫기</button></div>
      <div class="ah-nav">${C.sections.map(([k,t])=>`<button data-ah-go="${k}" class="${k===focus?"on":""}">${nav(t)}</button>`).join("")}</div></div>
      ${C.sections.map(([k,t,items])=>`<section class="ah-sec ${k===focus?"on":""}" id="ah-${k}"><h3>${t}</h3><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></section>`).join("")}
      ${C.footer?`<p class="ah-foot">${C.footer}</p>`:""}</div></div>`;
    requestAnimationFrame(()=>{const s=document.getElementById("ah-"+focus);if(s)s.scrollIntoView({block:"start"})});
    try{localStorage.setItem(C.seenKey,"1")}catch(e){}
  }
  function close(){const el=document.getElementById("ahLayer");if(el)el.innerHTML=""}
  function firstRun(focus){let seen=null;try{seen=localStorage.getItem(C.seenKey)}catch(e){}if(!seen)setTimeout(()=>open(focus),1200)}
  document.addEventListener("click",e=>{
    const go=e.target.closest("[data-ah-go]");if(go){const k=go.dataset.ahGo,s=document.getElementById("ah-"+k);document.querySelectorAll(".ah-nav button").forEach(b=>b.classList.toggle("on",b.dataset.ahGo===k));if(s)s.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
    const cl=e.target.closest("[data-ah-close]");if(cl){if(cl.classList.contains("ah-wrap")&&e.target!==cl)return;close();return}
    const op=e.target.closest("[data-ah]");if(op){e.preventDefault();open(op.dataset.ah)}
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector("#ahLayer .ah-wrap"))close()});
  return{init,open,close,chip,firstRun};
})();

/* ===== 오답 사진 노트 모듈 (수학 1등급 노트에서 검증) =====
   오프라인(종이)에서 푼 문제를 사진으로 찍어 → 채점(맞음/틀림/나중에) → 틀린 문제만 정리(출처·단원·이유·메모·정답 사진)
   → 1일·3일·7일 뒤 다시 풀기(문제 → 정답 확인 → 스스로 채점) → 3번 맞히면 졸업.
   사진은 그 기기의 IndexedDB에만 저장된다(서버로 가지 않음). 리포트 보낼 때 아이폰 공유 창으로 함께 보낸다. */
const PhotoNote=(function(){
  let C=null,db=null,ITEMS=[];const URLS={},RS={};let Q=[],T=null,listTab="review",viewId=null,confirmDel=null;
  const GAPS=[1,3,7];
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const R=s=>C.render?C.render(s):esc(s);
  const today=()=>C.today(),addDays=(s,n)=>C.addDays(s,n);
  const url=(p,k="blob")=>{const key=p.id+k;if(!URLS[key]&&p[k])URLS[key]=URL.createObjectURL(p[k]);return URLS[key]||""};
  const drop=(p)=>{["blob","ans"].forEach(k=>{if(URLS[p.id+k]){URL.revokeObjectURL(URLS[p.id+k]);delete URLS[p.id+k]}})};
  const st=()=>{const s=C.store();s.pnOff=s.pnOff||{};return s};
  const why=k=>(C.reasons.find(r=>r[0]===k)||[,""])[1];
  const unitLabel=id=>{const u=C.units().find(x=>x.id===id);return u?(u.short||u.label):"단원 미정"};
  function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(C.dbName,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("photos"))r.result.createObjectStore("photos",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
  const tx=m=>db.transaction("photos",m).objectStore("photos");
  const put=o=>new Promise((res,rej)=>{if(!db)return rej(new Error("사진 저장소를 열 수 없어요"));const r=tx("readwrite").put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  const del=id=>new Promise((res,rej)=>{if(!db)return rej();const r=tx("readwrite").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  function migrate(p){if(p.state)return false;p.unit=p.unit||p.sheet||null;p.state=p.grad?"grad":"review";p.stage=p.stage||0;p.due=p.due||today();delete p.sheet;delete p.grad;return true}
  async function load(){try{db=await idb();ITEMS=await new Promise((res,rej)=>{const r=tx("readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});for(const p of ITEMS)if(migrate(p))await put(p)}catch(e){ITEMS=[]}}
  async function shrink(file,rot=0){const u=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("이미지를 열 수 없어요"));i.src=u});
      const k=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k),sw=rot%180!==0,c=document.createElement("canvas");
      c.width=sw?h:w;c.height=sw?w:h;const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(img,-w/2,-h/2,w,h);
      return await new Promise(r=>c.toBlob(r,"image/jpeg",.7))}finally{URL.revokeObjectURL(u)}}
  const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  function layer(html,tall){let el=document.getElementById("pnLayer");if(!el){el=document.createElement("div");el.id="pnLayer";document.body.appendChild(el)}
    el.innerHTML=html?`<div class="pn-wrap" data-pn="close-bg"><div class="pn-sheet ${tall?"tall":""}" role="dialog" aria-modal="true"><div class="pn-grab"></div>${html}</div></div>`:""}
  const close=()=>{layer("");T=null;Q=[];viewId=null;confirmDel=null};
  function openCapture(){layer(`<h3 class="pn-h">오프라인 문제 채점</h3><p class="pn-muted">종이에 푼 문제를 찍고, 맞았는지 채점해요. 틀린 문제만 오답노트에 남아요. 지문이 길면 지문 쪽과 문항 쪽을 따로 찍고, 글자가 화면을 가득 채우게 찍어 줘.</p>
    <label class="pn-big" for="pnCam"><span class="pn-ic">📷</span><span><b>카메라로 찍기</b><small>한 문제씩 찍어요</small></span></label><input id="pnCam" type="file" accept="image/*" capture="environment" hidden>
    <label class="pn-big" for="pnAlbum"><span class="pn-ic">🖼️</span><span><b>앨범에서 여러 장 고르기</b><small>학원·학교에서 찍어 둔 사진을 한꺼번에</small></span></label><input id="pnAlbum" type="file" accept="image/*" multiple hidden>
    <button class="pn-big" data-pn="list"><span class="pn-ic">📒</span><span><b>오답노트 보기</b><small>${counts().inbox?`정리 대기 ${counts().inbox}장 · `:""}복습 중 ${counts().review}장 · 졸업 ${counts().grad}장</small></span></button>
    <button class="pn-btn" data-pn="close">닫기</button>`)}
  async function nextInQueue(){if(!Q.length){close();C.onChange();return}const f=Q.shift();C.toast&&C.toast("사진을 줄이는 중…");
    try{const blob=await shrink(f);T={blob,url:URL.createObjectURL(blob),rot:0,step:"grade",src:st().pnLastSrc||C.sources[0],unit:null,why:null,memo:"",ans:null,ansUrl:null};drawT()}
    catch(e){C.toast&&C.toast("이 사진은 열 수 없어요. 다음 사진으로 넘어갈게요");nextInQueue()}}
  function drawT(){const t=T,left=Q.length;
    if(t.step==="grade")return layer(`<div class="pn-row"><h3 class="pn-h">채점하기</h3><span class="pn-muted">${left?`남은 사진 ${left}장`:""}</span></div>
      <div class="pn-imgbox"><img src="${t.url}" alt="찍은 문제"><button class="pn-rot" data-pn="rot" aria-label="사진 돌리기">⟳</button></div>
      <p class="pn-muted">답지나 해설과 맞춰 보고 골라 줘.</p>
      <div class="pn-grid3"><button class="pn-ok" data-pn="g-ok">맞았어요</button><button class="pn-no" data-pn="g-no">틀렸어요</button><button class="pn-later" data-pn="g-later">나중에 정리</button></div>
      <button class="pn-link" data-pn="close">그만하기</button>`,true);
    const U=C.units(),groups=[...new Set(U.map(u=>u.group||""))];
    layer(`<h3 class="pn-h">오답노트에 정리</h3><div class="pn-imgbox small"><img src="${t.url}" alt="틀린 문제"></div>
      <div class="pn-lab">어디서 푼 문제야?</div><div class="pn-chips">${C.sources.map(s=>`<button class="${t.src===s?"on":""}" data-pn="t-src" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <label class="pn-lab" for="pnUnit">어느 단원이야?</label><select class="pn-inp" id="pnUnit"><option value="">모름 / 나중에</option>${groups.map(g=>`${g?`<optgroup label="${esc(g)}">`:""}${U.filter(u=>(u.group||"")===g).map(u=>`<option value="${esc(u.id)}" ${t.unit===u.id?"selected":""}>${esc(u.label)}</option>`).join("")}${g?"</optgroup>":""}`).join("")}</select>
      <div class="pn-lab">왜 틀렸어?</div><div class="pn-chips">${C.reasons.map(([k,n])=>`<button class="${t.why===k?"on":""}" data-pn="t-why" data-v="${k}">${esc(n)}</button>`).join("")}</div>
      <div class="pn-lab">정답·해설 사진 <span class="pn-muted">(있으면 복습 때 바로 맞춰 볼 수 있어요)</span></div>
      ${t.ansUrl?`<div class="pn-imgbox small"><img src="${t.ansUrl}" alt="정답 사진"><button class="pn-rot" data-pn="ans-x" aria-label="정답 사진 빼기">✕</button></div>`:`<div class="pn-grid2"><label class="pn-btn" for="pnAnsCam">📷 찍기</label><label class="pn-btn" for="pnAnsAlbum">🖼️ 앨범</label></div>`}
      <input id="pnAnsCam" type="file" accept="image/*" capture="environment" hidden><input id="pnAnsAlbum" type="file" accept="image/*" hidden>
      <label class="pn-lab" for="pnMemo">메모 <span class="pn-muted">(선택)</span></label><input class="pn-inp" id="pnMemo" maxlength="80" value="${esc(t.memo)}" placeholder="예: 선지 ③의 '항상' 놓침">
      <div class="pn-grid2"><button class="pn-btn" data-pn="t-back">뒤로</button><button class="pn-primary" data-pn="t-save">오답노트에 저장</button></div>`,true)}
  const keep=()=>{if(!T)return;const m=document.getElementById("pnMemo"),u=document.getElementById("pnUnit");if(m)T.memo=m.value;if(u)T.unit=u.value||null};
  async function saveT(state,btn){keep();const t=T;const p={id:nid(),ts:new Date().toISOString(),blob:t.blob,ans:t.ans||null,src:t.src,unit:t.unit,why:t.why,memo:(t.memo||"").trim(),state,stage:0,due:state==="review"?addDays(today(),GAPS[0]):null,sent:false};
    try{await put(p)}catch(e){C.toast&&C.toast("저장하지 못했어요. 이 브라우저가 사진 저장을 막고 있어요");return}
    ITEMS.push(p);const s=st();s.pnLastSrc=t.src;C.save();URL.revokeObjectURL(t.url);if(t.ansUrl)URL.revokeObjectURL(t.ansUrl);
    if(state==="review"){C.onXP&&C.onXP(5,btn);C.toast&&C.toast("오답노트에 저장했어요. 내일 복습에 나와요")}else C.toast&&C.toast("정리 대기함에 넣었어요");
    nextInQueue()}
  function offline(ok){const s=st(),d=today();s.pnOff[d]=s.pnOff[d]||{r:0,w:0};s.pnOff[d][ok?"r":"w"]++;const ks=Object.keys(s.pnOff).sort();while(ks.length>60)delete s.pnOff[ks.shift()];C.save()}
  function counts(){const c={inbox:0,review:0,grad:0,due:0};ITEMS.forEach(p=>{c[p.state]++;if(isDue(p))c.due++});return c}
  const isDue=p=>p.state==="review"&&p.due&&p.due<=today();
  function openList(tab){if(tab)listTab=tab;viewId=null;const c=counts();const L=ITEMS.filter(p=>p.state===listTab).sort((a,b)=>a.ts<b.ts?1:-1);
    layer(`<div class="pn-row"><h3 class="pn-h">오답노트</h3><button class="pn-link" data-pn="capture">+ 사진 추가</button></div>
      <div class="pn-tabs">${[["inbox","정리 대기",c.inbox],["review","복습 중",c.review],["grad","졸업",c.grad]].map(([k,n,v])=>`<button class="${listTab===k?"on":""}" data-pn="tab" data-v="${k}">${n} <b>${v}</b></button>`).join("")}</div>
      ${L.length?`<div class="pn-thumbs">${L.map(p=>`<button class="pn-thumb" data-pn="view" data-v="${p.id}"><img src="${url(p)}" alt="">${isDue(p)?`<i>오늘</i>`:""}${p.ans?`<em>정답有</em>`:""}<span>${esc(p.unit?unitLabel(p.unit):p.src)}</span></button>`).join("")}</div>`
        :`<p class="pn-muted pn-empty">${listTab==="inbox"?"나중에 정리하기로 한 사진이 여기에 모여요.":listTab==="review"?"틀린 문제를 찍어 두면 1일·3일·7일 뒤에 다시 풀게 해 줄게요.":"세 번 다시 맞힌 문제는 졸업해서 여기로 와요."}</p>`}
      <div class="pn-grid2"><button class="pn-btn" data-pn="export">사진 전체 내보내기</button><button class="pn-btn" data-pn="close">닫기</button></div>`,true)}
  function openView(id){const p=ITEMS.find(x=>x.id===id);if(!p)return openList();viewId=id;const rs=RS["v"+id]||{};
    layer(`<div class="pn-row"><button class="pn-link" data-pn="list">‹ 목록</button><span class="pn-muted">${p.ts.slice(0,10)}</span></div>
      <div class="pn-imgbox"><img src="${url(p)}" alt="문제 사진"></div>
      ${p.ans?(rs.ans?`<div class="pn-lab">정답·해설</div><div class="pn-imgbox"><img src="${url(p,"ans")}" alt="정답 사진"></div>`:`<button class="pn-btn" data-pn="v-ans" data-v="${p.id}">정답·해설 보기</button>`):""}
      <div class="pn-tags">${label(p).split(" · ").map(x=>`<span>${esc(x)}</span>`).join("")}</div>${p.memo?`<p>${esc(p.memo)}</p>`:""}
      <p class="pn-muted">${p.state==="grad"?"졸업했어요":p.state==="inbox"?"아직 정리 전이에요":`다음 복습 ${p.due} · 졸업까지 ${GAPS.length-p.stage}번`}${p.sent?" · 리포트로 보냄":""}</p>
      ${confirmDel===id?`<p class="pn-warn">이 사진을 지울까요? 되돌릴 수 없어요.</p><div class="pn-grid2"><button class="pn-btn" data-pn="view" data-v="${id}">취소</button><button class="pn-danger" data-pn="del" data-v="${id}">지우기</button></div>`
        :`<div class="pn-grid2"><button class="pn-primary" data-pn="edit" data-v="${id}">${p.state==="inbox"?"지금 정리하기":"정보 고치기"}</button><button class="pn-btn" data-pn="delask" data-v="${id}">삭제</button></div>`}`,true)}
  function edit(id){const p=ITEMS.find(x=>x.id===id);if(!p)return;T={edit:id,blob:p.blob,url:URL.createObjectURL(p.blob),step:"tag",src:p.src,unit:p.unit,why:p.why,memo:p.memo,ans:p.ans,ansUrl:p.ans?URL.createObjectURL(p.ans):null};drawT()}
  async function saveEdit(btn){keep();const p=ITEMS.find(x=>x.id===T.edit);if(!p)return;const wasInbox=p.state==="inbox";Object.assign(p,{src:T.src,unit:T.unit,why:T.why,memo:(T.memo||"").trim(),ans:T.ans||null});
    if(wasInbox){p.state="review";p.stage=0;p.due=addDays(today(),GAPS[0]);C.onXP&&C.onXP(5,btn)}drop(p);try{await put(p)}catch(e){}URL.revokeObjectURL(T.url);if(T.ansUrl)URL.revokeObjectURL(T.ansUrl);T=null;C.toast&&C.toast(wasInbox?"정리했어요. 내일 복습에 나와요":"고쳤어요");openView(p.id);C.onChange()}
  function dueCards(){return ITEMS.filter(isDue).sort((a,b)=>a.due<b.due?-1:1).map(p=>({id:"ph-"+p.id,k:"photo",ph:p}))}
  function cardHTML(p){const r=RS[p.id]||(RS[p.id]={step:0});
    const head=`<span class="pn-kind">오답 사진 · 복습 ${p.stage+1}번째</span><img class="pn-cardimg" src="${url(p)}" alt="틀린 문제 사진"><div class="pn-tags">${label(p).split(" · ").map(x=>`<span>${esc(x)}</span>`).join("")}</div>${p.memo?`<p class="pn-memo">${esc(p.memo)}</p>`:""}`;
    if(r.done)return head+`<span class="pn-done">${esc(r.done)}</span>`;
    if(r.step===0)return head+`<p class="pn-muted">종이에 다시 풀어 보고 눌러 줘.</p><button class="pn-primary" data-pn="r-check" data-v="${p.id}">다 풀었어요, 정답 확인</button>`;
    return head+(p.ans?`<div class="pn-lab">정답·해설</div><img class="pn-cardimg" src="${url(p,"ans")}" alt="정답 사진">`:`<p class="pn-muted">저장한 정답 사진이 없어요. 답지와 맞춰 보고 골라 줘.</p>`)+
      `<div class="pn-grid2"><button class="pn-ok" data-pn="r-ok" data-v="${p.id}">이번엔 맞았어요</button><button class="pn-no" data-pn="r-no" data-v="${p.id}">또 틀렸어요</button></div>`}
  async function review(id,ok,btn){const p=ITEMS.find(x=>x.id===id);if(!p)return;const r=RS[id]||(RS[id]={});
    if(ok){p.stage++;if(p.stage>=GAPS.length){p.state="grad";p.due=null;r.done="졸업! 이 문제는 이제 끝";C.confetti&&C.confetti(150)}else{p.due=addDays(today(),GAPS[p.stage]);r.done=`좋아! ${GAPS[p.stage]}일 뒤에 한 번 더`}C.onXP&&C.onXP(8,btn)}
    else{p.stage=0;p.due=addDays(today(),1);r.done="괜찮아, 내일 다시 보자"}
    try{await put(p)}catch(e){}C.redraw&&C.redraw("ph-"+id)}
  function label(p){return [p.src,p.unit?unitLabel(p.unit):"단원 미정",p.why?why(p.why):null].filter(Boolean).join(" · ")}
  function fileName(p,i,suffix=""){const d=p.ts.slice(5,10).replace("-","");return `${(p.unit?unitLabel(p.unit):"단원미정").replace(/[\\/:*?"<>|\s]+/g,"")}_${p.src}_${d}_${i+1}${suffix}.jpg`}
  const unsent=()=>ITEMS.filter(p=>!p.sent&&p.state!=="inbox").sort((a,b)=>a.ts<b.ts?-1:1);
  function files(list){const out=[];list.forEach((p,i)=>{out.push(new File([p.blob],fileName(p,i),{type:"image/jpeg"}));if(p.ans)out.push(new File([p.ans],fileName(p,i,"_정답"),{type:"image/jpeg"}))});return out}
  async function markSent(list){for(const p of list){p.sent=today();try{await put(p)}catch(e){}}}
  function reportLines(list){const c=counts(),s=st(),L=[];const days=Object.keys(s.pnOff).sort().slice(-14);let r=0,w=0;days.forEach(d=>{r+=s.pnOff[d].r;w+=s.pnOff[d].w});
    L.push(`■ 오프라인 풀이 채점 (최근 14일): 맞음 ${r} · 틀림 ${w}`);days.slice(-7).forEach(d=>L.push(`- ${d}: 맞음 ${s.pnOff[d].r} · 틀림 ${s.pnOff[d].w}`));
    L.push("",`■ 오답 사진${list&&list.length?` (이번에 함께 보낸 ${list.length}문제)`:""}`);(list||[]).forEach((p,i)=>L.push(`- ${fileName(p,i)}${p.ans?" (+정답 사진)":""}: ${label(p)}${p.memo?" / 메모: "+p.memo:""}`));
    L.push(`- 정리 대기 ${c.inbox} · 복습 중 ${c.review} · 졸업 ${c.grad} · 오늘 복습 ${c.due}`);return L}
  async function exportAll(){const all=ITEMS.slice().sort((a,b)=>a.ts<b.ts?-1:1);if(!all.length){C.toast&&C.toast("내보낼 사진이 없어요");return}
    const f=files(all);try{if(navigator.canShare&&navigator.canShare({files:f})){await navigator.share({files:f,title:"오답 사진 백업"});return}}catch(e){if(e&&e.name==="AbortError")return}

const pad=n=>String(n).padStart(2,"0");

function addDays(s,n){const[y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}

let CARDS=[];const BYID={};
const find=id=>BYID[id];
const cardsOf=c=>CARDS.filter(x=>x.u===c);
const cardLabel=c=>c.title||String(c.q||"").replace(/<[^>]+>/g,"");
const rec=id=>S.cards[id];
const isDone=c=>{const r=rec(c.id);return !!r&&(c.k==="concept"?!!r.seen:(r.n||0)>0)};
const isDue=c=>{const r=rec(c.id);return !!r&&!r.grad&&!!r.due&&r.due<=today()};
function unitPct(code){const cs=cardsOf(code);if(!cs.length)return 0;return Math.round(cs.filter(isDone).length/cs.length*100)}
function unitAcc(code){let r=0,n=0;cardsOf(code).forEach(c=>{const x=rec(c.id);if(x&&x.n){n+=x.n;r+=x.r||0}});return n?Math.round(r/n*100):null}

function rankOf(xp){let r=RANKS[0];for(const x of RANKS)if(xp>=x.min)r=x;return r}
function nextRank(xp){return RANKS.find(x=>x.min>xp)||null}
function addXP(n,el){const b=rankOf(S.xp).g;S.xp+=n;floatXP("+"+n+" XP",el);if(rankOf(S.xp).g<b){setTimeout(()=>{toast(`${rankOf(S.xp).g}등급 달성! 정말 잘하고 있어`);confetti(140)},400)}drawTop()}

function buildFeed(){const t=today();
  const due=CARDS.filter(isDue).slice(0,6).map(c=>c.id);
  const start=Math.max(0,UNIT_ORDER.indexOf(S.nowUnit));
  const order=UNIT_ORDER.slice(start).concat(UNIT_ORDER.slice(0,start));
  const fresh=[];for(const u of order){for(const c of cardsOf(u)){if(fresh.length+due.length>=TODAY_N)break;if(!rec(c.id)&&!due.includes(c.id))fresh.push(c.id)}}
  S.feed={date:t,ids:due.concat(fresh)};save()}
function todayFeed(){if(!S.feed||S.feed.date!==today())buildFeed();return S.feed.ids.map(find).filter(Boolean)}

function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}if(TTS.speakingId)document.querySelectorAll(`[data-speak="${CSS.escape(TTS.speakingId)}"]`).forEach(x=>x.classList.remove("speaking"));TTS.speakingId=null}

const JAMO={"ㄱ":"기역","ㄲ":"쌍기역","ㄴ":"니은","ㄷ":"디귿","ㄸ":"쌍디귿","ㄹ":"리을","ㅁ":"미음","ㅂ":"비읍","ㅃ":"쌍비읍","ㅅ":"시옷","ㅆ":"쌍시옷","ㅇ":"이응","ㅈ":"지읒","ㅉ":"쌍지읒","ㅊ":"치읓","ㅋ":"키읔","ㅌ":"티읕","ㅍ":"피읖","ㅎ":"히읗","ㅏ":"아","ㅐ":"애","ㅑ":"야","ㅒ":"얘","ㅓ":"어","ㅔ":"에","ㅕ":"여","ㅖ":"예","ㅗ":"오","ㅘ":"와","ㅙ":"왜","ㅚ":"외","ㅛ":"요","ㅜ":"우","ㅝ":"워","ㅞ":"웨","ㅟ":"위","ㅠ":"유","ㅡ":"으","ㅢ":"의","ㅣ":"이"};
const CIRC_H="㉠㉡㉢㉣㉤㉥㉦㉧㉨㉩㉪㉫㉬㉭",CIRC_HK="ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ",CIRC_S="㉮㉯㉰㉱㉲㉳㉴㉵㉶㉷㉸㉹㉺㉻",CIRC_SK="가나다라마바사아자차카타파하",CIRC_A="ⓐⓑⓒⓓⓔ",CIRC_AK=["에이","비","씨","디","이"],CIRC_N="①②③④⑤";
function jamoKo(s){return [...s].map(c=>JAMO[c]||c).join(" ")}
function hasBat(w){const c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<11172&&c%28!==0}
function korSay(t){let s=String(t||"").replace(/<[^>]+>/g,"").replace(/_([^_]+)_/g,"$1");
  s=s.replace(/[㉠-㉭]/g,c=>JAMO[CIRC_HK[CIRC_H.indexOf(c)]]).replace(/[㉮-㉻]/g,c=>CIRC_SK[CIRC_S.indexOf(c)]).replace(/[ⓐ-ⓔ]/g,c=>CIRC_AK[CIRC_A.indexOf(c)]).replace(/[①-⑤]/g,c=>(CIRC_N.indexOf(c)+1)+"번");
  s=s.replace(/([ㄱ-ㅣ]+)\s*(?:→|->)\s*([ㄱ-ㅣ]+)(?:\s*(?:으로|로))?/g,(m,a,b)=>{const x=jamoKo(a),y=jamoKo(b);return `${x}${hasBat(x)?"이":"가"} ${y}${hasBat(y)?"으로":"로"}`});
  s=s.replace(/\/([ㄱ-ㅣ]+)\//g,(m,a)=>jamoKo(a));
  s=s.replace(/\[([가-힣ː\s]+)\]/g,(m,a)=>` 발음 ${a.replace(/ː/g,"")}`);
  s=s.replace(/〈\s*보기\s*〉|<\s*보기\s*>/g,"보기").replace(/[「」『』《》〈〉‘’“”]/g,"").replace(/→/g," 그래서 ").replace(/\{\{|\}\}/g,"");
  s=s.replace(/(^|[^가-힣])([ㄱ-ㅣ]{1,3})(?=[^가-힣]|$)/g,(m,p,a)=>p+jamoKo(a));
  return s.replace(/\s+/g," ").replace(/\s+,/g,",").trim()}
function speakPassage(text,id){if(TTS.mode==="off"||!text)return;try{stopSpeak();
  const parts=korSay(text).split(/(?<=[.?!…])\s+|\n+/).map(x=>x.trim()).filter(Boolean);if(!parts.length)return;
  if(id){TTS.speakingId=id;document.querySelectorAll(`[data-speak="${CSS.escape(id)}"]`).forEach(x=>x.classList.add("speaking"))}
  const v=pickVoice();parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang="ko-KR";u.rate=TTS.rate;if(v)u.voice=v;
    if(i===parts.length-1&&id)u.onend=u.onerror=()=>{if(TTS.speakingId===id)stopSpeak()};speechSynthesis.speak(u)})}catch(e){toast("이 기기에서는 읽어 주기를 쓸 수 없어요")}}

function floatXP(txt,el){if(!el||!el.getBoundingClientRect)return;const r=el.getBoundingClientRect();const f=document.createElement("div");f.className="float";f.textContent=txt;f.style.left=(r.left+r.width/2)+"px";f.style.top=(r.top-6)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),950)}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n){if(reduce)return;const c=document.getElementById("fx"),x=c.getContext("2d");c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=["#ff4f8b","#ffc53d","#2fe0d0","#8a63ff"];const P=Array.from({length:n||120},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.4,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;(function loop(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<110)requestAnimationFrame(loop);else x.clearRect(0,0,innerWidth,innerHeight)})()}

const MARK_A="===== 백업 데이터 시작 (복원용, 수정하지 마세요) =====",MARK_B="===== 백업 데이터 끝 =====";
function buildReport(photos){const r=rankOf(S.xp),L=[],t=today(),whyName=k=>(REASONS.find(x=>x[0]===k)||[,"모름"])[1];
  L.push("[국어 1등급 노트 · 화법과 언어 학습 리포트]","학생: "+(S.studentName||"-")+" · 교과서: 천재교육(전은주)","생성일: "+t,"");
  L.push("■ 요약",`- 앱 등급: ${r.g}등급 / 총 ${S.xp} XP`,`- 공부한 날: ${S.studied.length}일 / 현재 연속 ${streak()}일 / 마지막 공부일 ${S.studied.slice().sort().pop()||"-"}`,
    `- ${EXAM.name}: ${EXAM.date}${EXAM.guess?" (예상)":""} · D-${dday()} · 범위 ${EXAM.range}`,`- 지금 진도: ${(UNIT_BY[S.nowUnit]||{}).n||"-"}`,
    `- 카드: ${CARDS.filter(isDone).length}/${CARDS.length} · 오늘 복습 대기 ${CARDS.filter(isDue).length} · 졸업 ${CARDS.filter(c=>(rec(c.id)||{}).grad).length}`,"");
  L.push("■ 단원별 진행 (진도 / 정답률)");UNIT_ORDER.filter(u=>cardsOf(u).length).forEach(u=>{const a=unitAcc(u);L.push(`- ${u} ${UNIT_BY[u].n}: ${unitPct(u)}% / ${a===null?"-":a+"%"}`)});L.push("");
  const ws=whyStats();L.push("■ 틀린 이유 (최근 14일, 오답 사진 포함)","- "+REASONS.map(([k,n])=>`${n} ${ws[k]}`).join(" · "),"");
  const wr=CARDS.filter(c=>(rec(c.id)||{}).wr).sort((a,b)=>rec(b.id).wr-rec(a.id).wr).slice(0,25);
  L.push(`■ 많이 틀린 카드 상위 ${wr.length}개 (틀린 횟수 · 마지막 이유 · 상태)`);wr.forEach(c=>{const x=rec(c.id);L.push(`- [${c.u}] ${cardLabel(c).slice(0,40)} · ${x.wr}회 · ${whyName(x.why)} · ${x.grad?"졸업":x.due?"복습 "+x.due:"-"}`)});L.push("");
  L.push("■ 최근 14일 (맞음/틀림 · 개념 카드)");const days=Object.keys(S.daily).sort().slice(-14);if(!days.length)L.push("- 기록 없음");days.forEach(k=>{const d=S.daily[k];L.push(`- ${k}: ${d.r||0}/${d.w||0} · 개념 ${d.c||0}`)});L.push("");
  L.push(...PhotoNote.reportLines(photos||[]),"");
  L.push(MARK_A,JSON.stringify(S),MARK_B);return L.join("\n")}
function parseBackup(txt){const a=txt.indexOf(MARK_A),b=txt.indexOf(MARK_B);const body=(a>=0&&b>a)?txt.slice(a+MARK_A.length,b):txt;try{const p=JSON.parse(body.trim());if(p&&p.v===1&&p.cards)return normalize(p)}catch(e){}return null}
async function doExport(how,btn){
  if(how==="share"){const ph=PhotoNote.unsent(),txt=buildReport(ph),fname=`국어-리포트-${today()}.txt`;
    try{const f=[new File([txt],fname,{type:"text/plain"}),...PhotoNote.files(ph)];
      if(navigator.canShare&&navigator.canShare({files:f})){await navigator.share({files:f,title:"국어 리포트"});await PhotoNote.markSent(ph);S.lastExport=today();save();U.report="";render();cheer(true);toast("보냈어요! 다음 주 카드를 기대해 줘");return}}
    catch(e){if(e&&e.name==="AbortError"){toast("보내기를 취소했어요");return}}
    U.report=txt;render();toast("이 화면에서는 공유 창이 안 열려요. 아래 글을 복사해 줘");return}
  const txt=buildReport([]);
  try{await navigator.clipboard.writeText(txt);S.lastExport=today();save();U.report="";render();toast("복사했어요. 채팅에 붙여 넣어 줘")}
  catch(e){U.report=txt;render();toast("길게 눌러 전체 선택 후 복사해 줘");const t=document.getElementById("reportTa");if(t){t.focus();t.select()}}}

function onClick(e){
  if(PhotoNote.click(e))return;
  const t=e.target.closest("button,[data-close-bg],input");if(!t)return;const d=t.dataset;
  if(d.ah!==undefined||d.ahGo!==undefined||d.ahClose!==undefined)return;
  if(d.tab){if(d.tab==="sheet"&&U.tab==="sheet")U.unit=null;if(d.tab==="feed")U.filter=null;go(d.tab);return}
  if(d.plus!==undefined){PhotoNote.openCapture();return}
  if(d.photolist!==undefined){PhotoNote.openList();return}
  if(d.story){if(d.story==="review"){U.filter=dueCount()?"review":null;go(dueCount()?"feed":"review")}else if(d.story==="wrong"){go("review")}else if(d.story==="today"){const c=todayFeed().find(x=>x.k==="concept");if(c)document.getElementById("card-"+c.id)?.scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"});else toast("오늘 개념 카드는 다 봤어요")}else toast(`${EXAM.name} ${EXAM.date}${EXAM.guess?" (예상)":""} · 범위 ${EXAM.range}`);return}
  if(d.unit){U.unit=d.unit;render();return}
  if(d.unitback!==undefined){U.unit=null;render();return}
  if(d.now){S.nowUnit=d.now;buildFeed();save();toast("오늘 피드를 이 단원부터 다시 짰어요");render();return}
  if(d.ufeed){U.filter=d.ufeed;go("feed");return}
  if(d.filter){U.filter=d.filter;go("feed");return}
  if(d.ugo){const [u,id]=d.ugo.split(":");U.filter=u;U.tab="feed";render();requestAnimationFrame(()=>document.getElementById("card-"+id)?.scrollIntoView({block:"start"}));return}
  if(d.unfilter!==undefined){U.filter=null;render();return}
  if(d.export){doExport(d.export,t);return}
  if(d.import){if(d.import==="toggle"){U.importOpen=!U.importOpen;U.importConfirm=null;render();return}
    if(d.import==="check"){const p=parseBackup((document.getElementById("importTa")||{}).value||"");if(!p){toast("백업 데이터를 찾지 못했어요. 리포트 전체를 붙여 넣어 줘");return}U.importConfirm=p;render();return}
    if(d.import==="cancel"){U.importConfirm=null;render();return}
    if(d.import==="apply"&&U.importConfirm){S=U.importConfirm;window.SET=S;U.importConfirm=null;U.importOpen=false;save();toast("복원했어요. 이어서 하자!");render();return}}
  if(d.reset){if(d.reset==="ask")U.confirmReset=true;else if(d.reset==="no")U.confirmReset=false;else{const keep={tts:S.tts,ttsRate:S.ttsRate,studentName:S.studentName,charName:S.charName};S=Object.assign(blank(),keep);window.SET=S;save();U.confirmReset=false;toast("기록을 지웠어요")}render();return}
  /* 읽어 주기 */
  if(d.speak){if(TTS.speakingId===d.speak){stopSpeak();return}if(TTS.mode==="off")return;const c=find(d.speak);if(!c)return;
    if(c.k==="passage")speakPassage(c.lead.replace(/^\[\d+\]\s*/,"")+"\n"+c.sents.join("\n")+"\n"+c.q,c.id);else speakKo(sayOf(c),c.id);return}
  if(d.ttstoggle!==undefined){if(S.tts==="off"){S.tts=S.ttsLast||"tap"}else{S.ttsLast=S.tts;S.tts="off";stopSpeak()}save();drawTop();redrawVisible();return}
  if(d.ttsmode){S.tts=d.ttsmode;if(S.tts==="off")stopSpeak();else{S.ttsLast=S.tts}save();render();if(S.tts!=="off")speakKo("읽어 주기 테스트예요.");return}
  if(d.ttsrate){S.ttsRate=+d.ttsrate;save();render();speakKo("이 속도로 읽어 줄게요.");return}
  /* 카드 */
  if(d.save){if(S.saved[d.save])delete S.saved[d.save];else S.saved[d.save]=today();save();toast(S.saved[d.save]?"저장했어요. 복습 탭에 모여요":"저장을 풀었어요");redrawCard(d.save);return}
  if(d.blank){const [id,i]=d.blank.split(":");U.rev[id]=U.rev[id]||{};U.rev[id][i]=!U.rev[id][i];seeConcept(find(id),t);redrawCard(id);return}
  if(d.explain){U.open[d.explain]=!U.open[d.explain];const c=find(d.explain);if(U.open[d.explain])seeConcept(c,t);redrawCard(d.explain);if(U.open[d.explain]&&TTS.mode==="auto")speakKo(sayOf(c),c.id);return}
  if(d.hint){U.hint[d.hint]=(U.hint[d.hint]||0)+1;const c=find(d.hint);if(c.k==="passage"&&U.hint[d.hint]>=c.hints.length)U.ev[d.hint]=1;redrawCard(d.hint);return}
  if(d.opt){const [id,i]=d.opt.split(":");const c=find(id);if(U.pick[id]!==undefined)return;U.pick[id]=+i;const ok=+i===c.ans;
    if(ok&&c.k==="passage"&&!U.hint[id]&&!U.again[id])S.stat.ev=(S.stat.ev||0)+1;
    record(c,ok,t);redrawCard(id);cheer(ok);drawTabs();return}
  if(d.why){const [id,k]=d.why.split(":");const r=rec(id);if(!r)return;if(r.why===k&&r.whyD===today()){r.why=null;S.whys=S.whys.filter(w=>!(w.id===id&&w.d===today()))}else{S.whys=S.whys.filter(w=>!(w.id===id&&w.d===today()));r.why=k;r.whyD=today();S.whys.push({d:today(),k,id});if(S.whys.length>400)S.whys.splice(0,S.whys.length-400);toast("기록했어요. 이 문제는 내일 복습에 나와요")}save();redrawCard(id);return}
  if(d.ev){U.ev[d.ev]=1;redrawCard(d.ev);return}
  if(d.model){U.self[d.model]=1;redrawCard(d.model);return}
  if(d.chk){const [id,i]=d.chk.split(":");U.chk[id]=U.chk[id]||{};U.chk[id][i]=t.checked;return}
  if(d.grade){const [id,g]=d.grade.split(":");const c=find(id);if(U.grade[id])return;U.grade[id]=g;if(!U.again[id])S.stat.self=(S.stat.self||0)+1;record(c,g==="g1",t);
    if(g!=="g1"){const r=rec(id);r.why=r.why||"c";r.whyD=today();S.whys.push({d:today(),k:r.why,id});save()}redrawCard(id);cheer(g==="g1");drawTabs();return}
}

    onChange:()=>render(),redraw:id=>redrawCard(id)});
  await PhotoNote.load();
  todayFeed().forEach(c=>{const r=rec(c.id);if(r&&r.last===today()&&c.k!=="concept"&&r.lastRes){U.again[c.id]=1;if(r.p!=null&&c.opts)U.pick[c.id]=r.p;if(r.g&&c.k==="self"){U.self[c.id]=1;U.grade[c.id]=r.g}}});
  document.addEventListener("click",onClick);
  render();
  AppHelp.firstRun("feed");
}


/* ===== 잠금 모듈 (수학 1등급 노트에서 검증) =====
   필요: 데이터 표시 두 곳(가이드 2-1 참고). 이 주석에는 표시 문자열을 그대로 쓰지 않는다.
   앱의 시작 코드는 startApp() 함수 안에 있다. 이 모듈이 DATA를 채운 뒤 startApp()을 부른다. */
const LOCK={APP_KEY:"korean-note-key",SHARED_KEY:"shlee-note-key",IMG:null,HELLO:"안녕! 처음 한 번만 비밀번호를 알려 줘. 그다음부터는 바로 열려."};
(function(){
  const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
  async function keyFromPw(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
  async function openWith(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(ENC.iv)},key,b64d(ENC.ct));return (new Function("return ("+new TextDecoder().decode(pt)+")"))()}
  async function savedKey(){try{const r=localStorage.getItem(LOCK.APP_KEY)||localStorage.getItem(LOCK.SHARED_KEY);if(!r)return null;return await crypto.subtle.importKey("raw",b64d(r),{name:"AES-GCM"},true,["decrypt"])}catch(e){return null}}
  function show(msg,bad){
    let el=document.getElementById("lockScreen");
    if(!el){el=document.createElement("div");el.id="lockScreen";document.body.appendChild(el)}
    el.innerHTML=`<div class="lk-card">${LOCK.IMG?`<img class="lk-img" src="${LOCK.IMG}" alt="">`:`<div class="lk-mono" aria-hidden="true">국</div>`}<div class="lk-bubble">${msg||LOCK.HELLO}</div>
      <form id="lkForm"><label for="lkPw">비밀번호</label><input id="lkPw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required class="${bad?"bad":""}"><button id="lkBtn">열기</button></form>
      <p class="lk-note">비밀번호는 보호자에게 받아요.</p></div>`;
    setTimeout(()=>{const i=document.getElementById("lkPw");if(i)i.focus()},100);
  }
  function done(d){DATA=d;const el=document.getElementById("lockScreen");if(el)el.remove();startApp()}
  document.addEventListener("submit",async e=>{if(e.target.id!=="lkForm")return;e.preventDefault();
    const pw=document.getElementById("lkPw").value,btn=document.getElementById("lkBtn");btn.disabled=true;btn.textContent="여는 중…";
    try{const key=await keyFromPw(pw);const d=await openWith(key);
      try{const raw=b64e(await crypto.subtle.exportKey("raw",key));localStorage.setItem(LOCK.APP_KEY,raw);localStorage.setItem(LOCK.SHARED_KEY,raw)}catch(_){}
      done(d)}
    catch(err){await new Promise(r=>setTimeout(r,600));show("음… 비밀번호가 달라요. 다시 한 번 확인해 줄래?",true)}});
  window.addEventListener("DOMContentLoaded",async()=>{
    if(!ENC){done(DATA);return} /* 암호화 전 원본(index.src.html)을 열면 바로 시작 */
    if(!window.crypto||!crypto.subtle){show("이 브라우저에서는 열 수 없어요. 아이폰 Safari로 열어 주세요.");return}
    const k=await savedKey();
    if(k){try{return done(await openWith(k))}catch(e){try{localStorage.removeItem(LOCK.APP_KEY)}catch(_){}}show("비밀번호가 바뀌었어. 새 비밀번호를 한 번만 알려 줘.");return}
    show();
  });
})();

</script>
